name: compare-sgov

# 임시 워크플로: 로컬(에이전트 샌드박스)에서 yfinance 접근이 막혀 있어
# 실제 시세 기반 비교표를 CI에서 뽑기 위한 용도. 결과 확보 후 삭제 예정.
on:
  push:
    branches: [claude/tqqq-sgov-strategy-comparison-kz6qhi]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run comparison
        run: |
          for i in 1 2 3; do
            python compare_sgov.py && exit 0
            echo "::warning::데이터 다운로드 실패, 재시도 $i"
            sleep 20
          done
          exit 1
